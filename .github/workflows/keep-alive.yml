name: Keep-Alive (prevents free host from sleeping)

# Pings your Render URL every 5 minutes so the free tier never idles out.
# UptimeRobot alternative - free, runs on GitHub itself.
#
# SETUP: after your bot is deployed, get your Render URL, e.g.
#   https://lua-obfuscator-bot.onrender.com
# then in GitHub: Settings -> Secrets and variables -> Actions -> New secret
#   Name:  RENDER_URL
#   Value: https://your-app-name.onrender.com

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}      # allow manual run button too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret not set - add it in repo Settings > Secrets > Actions"
            exit 0
          fi
          echo "Pinging ${{ secrets.RENDER_URL }}/health ..."
          curl -sS -m 60 "${{ secrets.RENDER_URL }}/health" || true
          curl -sS -m 60 "${{ secrets.RENDER_URL }}/" || true
